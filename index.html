<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon & Touch Icons -->
    <link rel="icon" type="image/jpeg" href="/Nayaklabs_Logo.jpeg" />
    <link rel="apple-touch-icon" href="/Nayaklabs_Logo.jpeg" />
    <meta name="theme-color" content="#0d0d12" />

    <!-- Primary SEO Meta Tags -->
    <title>Nayak Labs — AI Products, Technical Training & Software Services</title>
    <meta name="title" content="Nayak Labs — AI Products, Technical Training & Software Services" />
    <meta name="description" content="A studio for shipping AI products, training engineers, and building software that keeps teams moving. Three verticals, one obsession with craft." />
    <link rel="canonical" href="https://nayaklabs.com/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nayaklabs.com/" />
    <meta property="og:title" content="Nayak Labs — AI Products, Technical Training & Software Services" />
    <meta property="og:description" content="A studio for shipping AI products, training engineers, and building software that keeps teams moving." />
    <meta property="og:image" content="https://nayaklabs.com/NayakLabs.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://nayaklabs.com/" />
    <meta property="twitter:title" content="Nayak Labs — AI Products, Technical Training & Software Services" />
    <meta property="twitter:description" content="A studio for shipping AI products, training engineers, and building software that keeps teams moving." />
    <meta property="twitter:image" content="https://nayaklabs.com/NayakLabs.png" />

    <!-- Google Fonts: Outfit + Plus Jakarta Sans + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Synchronous FOUC Prevention Script -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('nayaklabs-theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
